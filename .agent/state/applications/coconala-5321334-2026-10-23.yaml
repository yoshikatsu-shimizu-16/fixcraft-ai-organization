proposal_text_reported_by_user: |-
  はじめまして、かつおと申します。
  翻訳の作業に文字起こしが役立つかを知りたい、というご依頼の目的を拝見しました。
  会社員として約20年、システム開発や社内SEをしており、普段から、システムのテストやユースケースに沿った動作確認を行っています。今回は、その視点と、一般の利用者としての視点の両方から、感想をお伝えできます。
  OPPO Reno7（Android）の実機を持っており、普段から音声入力を日常的に使っています。文字起こしに翻訳まで一緒にできれば、かなり便利だと感じているので、実際の使い心地を試してみたいと思い応募しました。
  ご契約後、いただいたURLからアプリを入れて試し、翻訳の作業に役立つかどうかを中心に、使用感と改善点を文章でお返しします。
  お返しは、ご契約から3日以内を目安にします。
  率直な感想をお伝えしますので、よろしくお願いいたします。
proposal_text_note: "上記は提供文面の『はじめまして』以降の本文。ユーザーのチャット中の『スマホアプリの評価（ココナラ）は応募したよ！リポジトリに反映しておいて』という文章が実際の送信文にも入ったかは未確認。"
