version: "2.0"
scale: 100
thresholds:
  pursue: 75
  hold: 60
  reject_below: 60
hard_blockers:
  - "違法、不正、利用規約違反を前提とする"
  - "必須納期が物理的に不可能"
  - "根拠のない実績・資格・成果の偽装を要求する"
  - "要件情報が不足し、質問しても価格・工数・主要リスクを評価できない"
criteria:
  fit:
    max: 20
    anchors:
      20: "同種実績または検証済みPlaybookがあり、主要技術が既知"
      15: "主要技術は経験済みで、一部調査のみ必要"
      10: "隣接経験はあるが、重要な未知要素がある"
      5: "大半が未経験で受注前検証が重い"
      0: "対応能力外"
  win_path:
    max: 20
    anchors:
      20: "競合比較に基づき、顧客価値へ直結する明確な差別化が2つ以上ある"
      15: "差別化が1つ明確で、Proofを提示できる"
      10: "一般的な強みはあるが競合との差が弱い"
      5: "価格以外の勝ち筋がほぼない"
      0: "勝ち筋を説明できない"
  price:
    max: 15
    anchors:
      15: "見積工数と不確実性を含めても十分な採算余地"
      10: "採算可能だが余裕は小さい"
      5: "追加作業が出ると赤字化しやすい"
      0: "予算と要求が明確に破綻"
  urgency:
    max: 10
    anchors:
      10: "顧客の具体的な期限・損失があり、FixCraftの即応性が価値になる"
      5: "期限はあるが差別化には直結しない"
      0: "期限不明または急ぎすぎて実行不能"
  client_quality:
    max: 10
    anchors:
      10: "要件・評価・支払/発注実績等の観測情報から信頼性が高い"
      5: "情報は限定的だが重大警告なし"
      0: "重大な不整合、危険な要求、支払/コミュニケーション懸念"
  risk:
    max: 15
    scoring_direction: "低リスクほど高得点"
    anchors:
      15: "主要リスクが既知で回避策あり"
      10: "管理可能な未知要素が少数"
      5: "要件変動・外部依存・権限等に高い不確実性"
      0: "重大リスクを制御できない"
  competition:
    max: 10
    anchors:
      10: "競合密度が低い、または競合より明確な優位性あり"
      5: "競合は多いが差別化余地あり"
      0: "強い競合が多く、価格以外の優位性を示せない"
missing_evidence_rule: "観測できない項目を中間点で埋めず、Unknownとして保守的に採点しneeds_more_evidenceを検討する"
