version: "2.1"
scale: 100
strategy_phase: "cash_and_track_record"
thresholds:
  pursue: 70
  hold: 55
  reject_below: 55
hard_blockers:
  - "違法、不正、利用規約違反を前提とする"
  - "必須納期が物理的に不可能"
  - "根拠のない実績・資格・成果の偽装を要求する"
  - "要件情報が不足し、質問しても価格・工数・主要リスクを評価できない"
criteria:
  fit:
    max: 10
    anchors:
      10: "同種実績または検証済みPlaybookがあり、主要作業を確実に実行できる"
      7: "主要作業は経験済みで、一部調査のみ必要"
      5: "隣接経験はあるが、重要な未知要素がある"
      2: "大半が未経験で受注前検証が重い"
      0: "対応能力外"
  win_path:
    max: 15
    anchors:
      15: "競合比較に基づき、顧客価値へ直結する明確な差別化が2つ以上ある"
      11: "差別化が1つ明確で、Proofを提示できる"
      7: "一般的な強みはあるが競合との差が弱い"
      3: "価格以外の勝ち筋がほぼない"
      0: "勝ち筋を説明できない"
  price:
    max: 15
    anchors:
      15: "見積工数と不確実性を含めても十分な採算余地"
      10: "採算可能だが余裕は小さい"
      5: "追加作業が出ると赤字化しやすい"
      0: "予算と要求が明確に破綻"
  cash_velocity:
    max: 15
    anchors:
      15: "短時間で完了でき、採用後すぐ着手・納品・検収まで進みやすい"
      10: "数日以内の納品が見込め、支払条件も明確"
      5: "着手や検収までに不確定要素がある"
      0: "長期選考・長期拘束・支払条件不明など現金化が遠い"
  track_record:
    max: 10
    anchors:
      10: "完了実績・評価を短期間で1件積める可能性が高い"
      7: "受注実績として計上できるが評価獲得までやや時間がかかる"
      3: "継続前提で単発実績として残りにくい"
      0: "実績・評価の蓄積にほぼ寄与しない"
  urgency:
    max: 5
    anchors:
      5: "顧客の具体的な期限・損失があり、即応性が価値になる"
      3: "期限はあるが差別化には直結しない"
      0: "期限不明または急ぎすぎて実行不能"
  client_quality:
    max: 10
    anchors:
      10: "要件・評価・支払/発注実績等の観測情報から信頼性が高い"
      5: "情報は限定的だが重大警告なし"
      0: "重大な不整合、危険な要求、支払/コミュニケーション懸念"
  risk:
    max: 10
    scoring_direction: "低リスクほど高得点"
    anchors:
      10: "主要リスクが既知で回避策あり、納品失敗リスクが低い"
      7: "管理可能な未知要素が少数"
      3: "要件変動・外部依存・権限等に高い不確実性"
      0: "重大リスクを制御できない"
  competition:
    max: 10
    anchors:
      10: "応募数が少ない、募集人数が複数、または競合より明確な優位性あり"
      5: "競合は多いが差別化余地あり"
      0: "強い競合が多く、価格以外の優位性を示せない"
phase_rules:
  - "現在は現金化と受注実績・評価の獲得を最優先する。SE実績・技術的高度さ・ポートフォリオ価値は加点要素であり必須条件ではない。"
  - "2,000〜5,000円程度でも1〜2時間で終わる見込みがあり、受注確率と採算が許容でき、低リスクで確実に納品できる案件は積極評価する。"
  - "LLM評価、AI出力レビュー、プロンプト検証、ツール評価、データラベリング、Web調査、リスト作成、データ入力、商品登録、QA、ユーザーテスト等を非技術という理由だけで減点しない。"
  - "同点なら、短時間で納品できる、応募が少ない、募集人数が多い、発注者実績がある、支払条件が明確な案件を優先する。"
missing_evidence_rule: "観測できない項目を中間点で埋めず、Unknownとして保守的に採点しneeds_more_evidenceを検討する。ただし技術スタックの詳細が不要な単純作業では、技術情報がないこと自体を不足Evidenceとして扱わない。"
