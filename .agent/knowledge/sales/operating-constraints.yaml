version: "1.1"
strategy:
  phase: "cash_and_track_record"
  monthly_cash_kpi_jpy: 20000
  target_monthly_wins_min: 3
  target_monthly_wins_max: 6
  priority_order:
    - "actual_cash"
    - "completed_job_count"
    - "client_rating_and_feedback"
    - "repeatability_by_category"
    - "technical_portfolio_value"
  technical_portfolio_required: false
  notes:
    - "SEとしての実績になるかは加点要素であり必須条件ではない"
    - "LLM評価・AIテスト・Web調査・データ入力等の非開発案件も現金化と実績獲得の候補として扱う"
commercial:
  minimum_effective_hourly_rate_jpy: null
  missing_rate_behavior: "Sales Director must show economics as unknown and request human input instead of inventing a threshold"
  preferred_single_job_min_jpy: 2000
  preferred_single_job_max_jpy: 20000
  small_job_rule: "2,000〜5,000円程度でも、1〜2時間で完了見込み、低リスク、条件明確、受注確率と時給換算が許容できるなら積極評価する"
  low_value_patterns:
    - "1件数円レベルで大量件数が必要"
    - "時給換算が著しく低い"
    - "報酬条件が不明確"
    - "作業量が膨張しやすい"
    - "サイト外誘導が前提"
availability:
  downrank:
    - "平日日中の強い拘束"
    - "週20時間超の稼働"
    - "長期常駐"
    - "大量制作・大量処理で総工数が読めない"
prototype:
  default_timebox_minutes: 30
  budget_tiers:
    - {max_budget_jpy: 9999, max_minutes: 15}
    - {max_budget_jpy: 29999, max_minutes: 30}
    - {max_budget_jpy: 99999, max_minutes: 60}
    - {max_budget_jpy: null, max_minutes: 90}
  extension_rule: "Any extension beyond the selected tier requires explicit human approval"
outcome:
  no_response_after_days: 7
  rule: "Use no_response only when at least this many days have elapsed since the latest outbound message and there is no client reply"
  track:
    - "applications"
    - "replies"
    - "wins"
    - "losses"
    - "actual_work_hours"
    - "actual_revenue_jpy"
    - "client_rating"
    - "category"
search_execution:
  success_definition: "探索の成功は検索を実行したことではなく、応募判断に進めるGate 1候補を見つけること。候補0件や弱い候補だけの場合は、同一Run内で検索語・カテゴリ・市場を変えて追加探索する。"
  persistence_rule: "enabled市場と必須カテゴリの確認が終わる前、または有望候補が3件未満のまま未探索経路が残っている場合は探索を止めない。検索結果を水増しせず、掲載直後・新着順・類義語・隣接カテゴリ・技術評価/モニター・小粒現金化案件へ検索を広げる。"
  exhausted_rule: "有望候補が不足したまま終了する場合は、確認済み市場・検索語・0件/除外理由・未確認経路をEvidenceとして残し、翌Runで未確認または新着部分から再開する。"
  kpi_gap_rule: "毎Runで月20,000円KPIまでの契約額/実現売上の不足額を確認し、不足がある限り新規案件探索を継続する。1件受注しただけで探索を弱めない。"
  actionability_rule: "生の検索ヒット数ではなく、応募可能・条件適合・締切前の案件数を成果として扱う。Human Gate未判断の高適合案件は締切残時間を優先して提示する。"
analysis:
  preferred_competitor_sample_size: 3
  small_sample_warning_below: 3
  phase_learning_rule: "カテゴリ別の応募数・返信率・受注率・実作業時間・実収益・評価を蓄積し、十分なサンプルができるまで対象カテゴリを早期に絞り込みすぎない"
